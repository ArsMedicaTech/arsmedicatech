# secrets.yaml  ← add to .gitignore
minio:
  auth:
    rootUser: "glitchtip-minio-admin"
    rootPassword: "some-long-random-password-here"

glitchtip:
  environment:
    AWS_ACCESS_KEY_ID: "glitchtip-minio-admin"
    AWS_SECRET_ACCESS_KEY: "some-long-random-password-here"
    SECRET_KEY: "your-django-secret-key"
    DATABASE_URL: "postgresql://glitchtip:glitchtip-db-password@glitchtip-postgresql:5432/glitchtip"
