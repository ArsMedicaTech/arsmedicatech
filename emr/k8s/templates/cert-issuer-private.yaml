apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-prod
spec:
  acme:
    # Your email address
    email: {{ .Values.certManagerEmail }}

    # Production ACME server
    server: https://acme-v02.api.letsencrypt.org/directory

    # Reference for the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-dns-prod-account-key

    # The DNS-01 solver
    solvers:
      - dns01:
          route53:
            # Your AWS region (e.g., us-east-1)
            region: us-east-1

            # The Hosted Zone ID you found in Step 1
            hostedZoneID: Z08938902XRN3NPQ6S7BU

            accessKeyIDSecretRef:
              name: aws-route53-creds
              key: access-key-id  # <-- This is a LITERAL string

            # Reference to the Secret Access Key
            secretAccessKeySecretRef:
              name: aws-route53-creds
              key: secret-access-key # <-- This is a LITERAL string
