# ecr-secret-refresher.yaml

# ServiceAccount the CronJob pod will run as
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
  namespace: kube-system

---
# Allow the ServiceAccount to create/update secrets in arsmedicatech-oss
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-writer
  namespace: arsmedicatech-oss
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-writer
  namespace: arsmedicatech-oss
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: kube-system
roleRef:
  kind: Role
  name: ecr-secret-writer
  apiGroup: rbac.authorization.k8s.io

---
# Same Role + RoleBinding for arsmedicatech-synapticl
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-writer
  namespace: arsmedicatech-synapticl
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-writer
  namespace: arsmedicatech-synapticl
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: kube-system
roleRef:
  kind: Role
  name: ecr-secret-writer
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-writer
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-writer
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: kube-system
roleRef:
  kind: Role
  name: ecr-secret-writer
  apiGroup: rbac.authorization.k8s.io

---
# Same Role + RoleBinding for typesense (needed by the rxnorm-ingest CronJob)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-writer
  namespace: typesense
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-writer
  namespace: typesense
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: kube-system
roleRef:
  kind: Role
  name: ecr-secret-writer
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresher
  namespace: kube-system
spec:
  schedule: "0 */6 * * *"    # every 6 hours — well within the 12h ECR token expiry
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          # NO imagePullSecrets — image is public on GHCR, no auth needed
          restartPolicy: OnFailure
          containers:
            - name: refresher
              image: ghcr.io/darren277/ecr-refresher:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: aws-ecr-credentials
              env:
                # TODO: Make this into an env var.
                - name: NAMESPACES
                  value: "arsmedicatech-oss arsmedicatech-synapticl kube-system typesense"

