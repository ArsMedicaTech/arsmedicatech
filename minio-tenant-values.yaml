tenant:
  name: amt-minio

  pools:
    - name: pool-0
      servers: 4
      volumesPerServer: 4
      size: 10Gi
      storageClassName: do-block-storage-retain

  buckets:
    - name: amt-uploads

  users:
    - name: amt-user

  configSecret:
    name: minio-credentials
    accessKey: admin
    secretKey: supersecret

  console:
    enabled: true

ingress:
  api:
    enabled: true
    host: s3.arsmedicatech.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    tls:
      - secretName: minio-api-tls
        hosts:
          - s3.arsmedicatech.com

  console:
    enabled: true
    host: minio.arsmedicatech.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    tls:
      - secretName: minio-console-tls
        hosts:
          - minio.arsmedicatech.com
