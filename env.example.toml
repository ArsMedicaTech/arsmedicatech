# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
namespace = "arsmedicatech-synapticl"          # Kubernetes namespace for all resources

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

# ── my-api ──────────────────────────────────────────────────────────────────
[services.my-api.config]
# Non-sensitive: written to Vault KV AND a Kubernetes ConfigMap
APP_ENV       = "production"
LOG_LEVEL     = "info"
API_BASE_URL  = "https://api.internal"
FEATURE_FLAGS = "flag_a,flag_b"

[services.my-api.secrets]
# Sensitive: written to Vault KV only; ESO syncs to a K8s Secret
STRIPE_API_KEY  = "sk_live_abc123"
SENDGRID_API_KEY = "SG.xyz789"

[services.my-api.dynamic]
# Vault-generated credentials: script configures the Vault database engine.
# No credential values are stored here — Vault generates them at runtime.
[[services.my-api.dynamic.databases]]
name              = "my-api-postgres"           # Vault connection name
plugin            = "postgresql-database-plugin"
connection_url    = "postgresql://{{username}}:{{password}}@postgres.internal:5432/mydb"
vault_admin_user  = "vault_admin"
vault_admin_pass  = "vault_admin_password"      # only used once to configure the engine
role_name         = "my-api-db-role"
default_ttl       = "1h"
max_ttl           = "24h"
creation_sql      = """
    CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\";
"""

# ── another-service ─────────────────────────────────────────────────────────
[services.another-service.config]
APP_ENV   = "production"
LOG_LEVEL = "warn"
REDIS_URL = "redis://redis.internal:6379"

[services.another-service.secrets]
INTERNAL_API_SECRET = "supersecret"
